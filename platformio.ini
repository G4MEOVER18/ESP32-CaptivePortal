; PlatformIO Project Configuration – ESP32-CaptivePortal
; Nutzt die Arduino-ESP32 Core 3.x WiFi.AP-API (WiFi.AP.create / enableDhcpCaptivePortal),
; daher die pioarduino-Plattform (offizielles PlatformIO bietet nur Core 2.x).
;
; Build:  pio run
; Flash:  pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
src_dir = src/CaptivePortal

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Keine externen Libraries – nur ESP32-Arduino-Core (WiFi, DNSServer, WebServer).
